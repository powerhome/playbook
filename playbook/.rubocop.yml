inherit_from: ../.rubocop.yml

# Appraisal 2.5 generates these headers and its header customization fails on Ruby 3.4.
Style/FrozenStringLiteralComment:
  Exclude:
    - "gemfiles/*.gemfile"

AllCops:
  Exclude:
    - "spec/**/*"
    - "bin/*"
    - "node_modules/**/*"
    - "vendor/**/*"

Layout/BlockAlignment:
  Exclude:
    - private/tasks/pb_release.rake
