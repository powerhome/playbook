# PR / review stacks.
# Milano DEPLOY_URL is the website host (e.g. https://pr6468.playbook...).
# bin/deploy derives MCP host as https://mcp-pr6468.playbook...
# SECRET_KEY_BASE is generated at deploy time (bin/deploy) — not stored in this public repo.
ingress:
  issueCert: false # Certificate issued once per cluster in the playbook-prs namespace

# Review stacks run RAILS_ENV=production; allowlist must be non-empty (boot fail-closed).
# "*" is OK here: PR ingress is VPN-only. Staging/production must use real client IPs.
appConfig:
  rackEnv: "production"
  railsEnv: "production"
  allowlist: "*"

# Smaller footprint on review stacks
replicas: 1
