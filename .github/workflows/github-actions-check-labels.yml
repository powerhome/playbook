name: Check Labels
run-name: ${{ github.actor }} is checking labels 🚀
on:
  pull_request:
    types: [ labeled, unlabeled ]
cache-mode: none
jobs:
  Checking-Labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check for Semver label
        id: check-labels
        run: |
          LABELS=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
          SEMVER_PATTERN="^(major|minor|patch)$"
          REQUIRED_LABEL_PATTERN="^(enhancement|bug|improvement|new kit|deprecated|breaking)$"

          SEMVER_LABELS=$(echo "$LABELS" | grep -iE "$SEMVER_PATTERN" || true)
          REQUIRED_LABELS=$(echo "$LABELS" | grep -iE "$REQUIRED_LABEL_PATTERN" || true)

          errors=""
          add_error() {
            if [ -n "$errors" ]; then
              errors="${errors}"$'\n'"$1"
            else
              errors="$1"
            fi
          }

          if [ -z "$REQUIRED_LABELS" ]; then
            add_error "No required label found. Please add at least one of: enhancement, bug, improvement, new kit, deprecated, breaking (case-insensitive)"
          fi

          if [ -z "$SEMVER_LABELS" ]; then
            add_error "No Semver label found. Please add exactly one of: major, minor, patch (case-insensitive)"
          else
            SEMVER_LABEL_COUNT=$(echo "$SEMVER_LABELS" | wc -l)
            if [ "$SEMVER_LABEL_COUNT" -gt 1 ]; then
              SEMVER_LABEL_LIST=$(echo "$SEMVER_LABELS" | paste -sd ', ' -)
              add_error "Multiple Semver labels found. Please ensure only one is present: $SEMVER_LABEL_LIST"
            else
              NORMALIZED_LABEL=$(echo "$SEMVER_LABELS" | tr '[:upper:]' '[:lower:]')
              echo "Valid Semver label found: $NORMALIZED_LABEL"
            fi
          fi

          if [ -n "$errors" ]; then
            echo "Error:"
            echo "$errors"
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$errors"
            {
              echo "message<<EOF"
              echo "$errors"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Leave PR comment
        if: success() || failure()
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check-labels.outcome }}
          ERROR_MESSAGE: ${{ steps.check-labels.outputs.message }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- playbook-label-check -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            for (const comment of comments) {
              if ((comment.body || "").includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
            }

            if (process.env.CHECK_OUTCOME === "success" || !process.env.ERROR_MESSAGE) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `${process.env.ERROR_MESSAGE}\n\n${marker}`,
            });