name: Check Labels
run-name: ${{ github.actor }} is checking labels 🚀
on:
  pull_request:
    types: [ labeled, unlabeled ]
concurrency:
  group: check-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false
cache-mode: none
jobs:
  Checking-Labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check for Semver label
        id: check-labels
        run: |
          LABELS=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
          SEMVER_PATTERN="^(major|minor|patch)$"
          REQUIRED_LABEL_PATTERN="^(enhancement|bug|improvement|new kit|deprecated|breaking)$"

          SEMVER_LABELS=$(echo "$LABELS" | grep -iE "$SEMVER_PATTERN" || true)
          REQUIRED_LABELS=$(echo "$LABELS" | grep -iE "$REQUIRED_LABEL_PATTERN" || true)

          fail() {
            echo "Error: $1"
            {
              echo "message<<EOF"
              echo "$1"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          }

          if [ -z "$REQUIRED_LABELS" ]; then
            fail "No required label found. Please add at least one of: enhancement, bug, improvement, new kit, deprecated, breaking (case-insensitive)"
          fi

          # Check if SEMVER_LABELS is empty
          if [ -z "$SEMVER_LABELS" ]; then
            fail "No Semver label found. Please add exactly one of: major, minor, patch (case-insensitive)"
          fi

          SEMVER_LABEL_COUNT=$(echo "$SEMVER_LABELS" | wc -l)

          if [ "$SEMVER_LABEL_COUNT" -eq 0 ]; then
            fail "No Semver label found. Please add exactly one of: major, minor, patch (case-insensitive)"
          elif [ "$SEMVER_LABEL_COUNT" -gt 1 ]; then
            SEMVER_LABEL_LIST=$(echo "$SEMVER_LABELS" | paste -sd ', ' -)
            fail "Multiple Semver labels found. Please ensure only one is present: $SEMVER_LABEL_LIST"
          else
            NORMALIZED_LABEL=$(echo "$SEMVER_LABELS" | tr '[:upper:]' '[:lower:]')
            echo "Valid Semver label found: $NORMALIZED_LABEL"
          fi
      - name: Leave PR comment
        if: success() || failure()
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check-labels.outcome }}
          ERROR_MESSAGE: ${{ steps.check-labels.outputs.message }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- playbook-label-check -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.filter((comment) => {
              const body = comment.body || "";
              return body.includes(marker) ||
                body.startsWith("No required label found.") ||
                body.startsWith("No Semver label found.") ||
                body.startsWith("Multiple Semver labels found.");
            });

            if (process.env.CHECK_OUTCOME === "success") {
              for (const comment of existing) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
              return;
            }

            const body = `${process.env.ERROR_MESSAGE}\n\n${marker}`;
            const [current, ...duplicates] = existing;

            if (!current) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } else if (current.body !== body) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: current.id,
                body,
              });
            }

            for (const comment of duplicates) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }