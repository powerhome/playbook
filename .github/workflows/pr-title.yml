name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      # The repository squash-merges with the PR title as the commit subject,
      # so the title is what has to be a Conventional Commit.
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
