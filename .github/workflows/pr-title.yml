name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      # The repository squash-merges with the PR title as the commit subject,
      # so the title is what has to be a Conventional Commit.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
